<script>
    let numero = 0
    let soma = 0 // A soma deve iniciar em 0
    
    while (numero >= 0) {
        numero = Number(prompt('Digite o número positivo para soma (negativo para parar)'))
        
        if (numero >= 0) {
            soma = soma + numero 
        } else {
            document.write(`O resultado é ${soma}`)
    }
    }
</script>
