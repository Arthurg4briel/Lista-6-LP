<script>
    let maior = -Infinity;
    let num = Number(prompt("Digite um valor (-1 para encerrar):"));
    while(num !== -1) {
        if(num > maior) maior = num;
        num = Number(prompt("Digite um valor (-1 para encerrar):"));
    }
    if(maior !== -Infinity) {
        document.write(`O maior valor digitado foi: ${maior}`);
    } else {
        document.write("Nenhum valor válido foi digitado.");
    }
</script>
