<script>
    let count = 0;
    let num = Number(prompt("Digite um número (0 para encerrar):"));
    while(num !== 0){
        if(num % 3 === 0) {
            count++;
        }
        num = Number(prompt("Digite um número (0 para encerrar):"));
    }
    document.write(`Foram digitados ${count} números divisíveis por 3.`);
</script>
