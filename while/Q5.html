<script>
    let nota = 0
    let media = 0
    let qtd_notas = 0
    let soma = 0
    while(nota >= 0){
        nota = Number(prompt("Digite a nota (digitar uma nota negativa encerra)"))

        if(nota >= 0){
            qtd_notas++
            soma = soma + nota
            media = soma/qtd_notas 
        } else {
            document.write(`A média das notas são ${media}`)
        }
    }
</script>
