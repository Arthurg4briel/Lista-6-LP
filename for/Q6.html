<script>
    let maior = -Infinity;
    for(let num = Number(prompt("Digite um valor (-1 para encerrar):")); num !== -1; num = Number(prompt("Digite um valor (-1 para encerrar):"))) {
        if(num > maior) maior = num;
    }
    if(maior !== -Infinity) {
        document.write(`O maior valor digitado foi: ${maior}`);
    } else {
        document.write("Nenhum valor válido foi digitado.");
    }
</script>
