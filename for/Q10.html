<script>
    let count = 0;
    for(let num = Number(prompt("Digite um número (0 para encerrar):")); num !== 0; num = Number(prompt("Digite um número (0 para encerrar):"))){
        if(num >= 100 && num <= 200) {
            count++;
        }
    }
    document.write(`Foram digitados ${count} números entre 100 e 200.`);
</script>
